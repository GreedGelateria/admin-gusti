<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etichette banco — GREED</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Noto+Serif+Display:wdth,wght@62.5..100,400..800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--verde:#1f3a1a;--verde2:#2d6a4f;--crema:#f6f1e6;--oro:#c8a34a;--testo:#2a2a22}
*{box-sizing:border-box}
body{margin:0;font-family:'Outfit',sans-serif;background:var(--crema);color:var(--testo)}
header{background:var(--verde);color:#f6f1e6;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;margin:0;letter-spacing:.06em}
header .sp{flex:1}
button{font-family:inherit;cursor:pointer;border-radius:8px;border:0;padding:9px 16px;font-size:14px;font-weight:600}
.b-oro{background:var(--oro);color:var(--verde)} .b-ghost{background:transparent;color:#f6f1e6;border:1px solid rgba(246,241,230,.4)}
.b-verde{background:var(--verde2);color:#fff}
main{padding:18px 22px;max-width:1500px;margin:0 auto}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#fff;border:1px solid #d8ccb4;color:var(--testo)} .tab.on{background:var(--verde2);color:#fff;border-color:var(--verde2)}
.stato{font-size:13px;color:#6a6a5a}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.scheda{background:#fff;border:1px solid #e3d8c2;border-radius:12px;padding:12px;display:flex;gap:12px}
.scheda.sel{outline:3px solid var(--verde2)}
.anteprima{width:144px;flex-shrink:0}
.anteprima .eti{transform:scale(.5);transform-origin:top left}
.anteprima-box{width:144px;height:210px;overflow:hidden;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.campi{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.campi label{font-weight:600;color:#6a5a40;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.campi input,.campi select{width:100%;padding:6px 8px;border:1px solid #d8ccb4;border-radius:6px;font-family:inherit;font-size:13px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eef2ea;color:var(--verde2);font-weight:600}
.chip.nuovo{background:#fdf0d5;color:#8a5a00}
/* ── ETICHETTA 72 × 105 mm — stile vintage GREED ── */
.eti{width:72mm;height:105mm;background:#fff;position:relative;overflow:hidden;color:#1d2a1a}
.eti .sagoma{position:absolute;inset:0;width:72mm;height:105mm}
.eti .logo{position:absolute;top:7.2mm;left:0;right:0;text-align:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:5.4mm;letter-spacing:.12em;padding-left:.12em;color:#1d2a1a;line-height:1}
.eti .logo img{height:9mm;display:block;margin:0 auto}
.eti .sotto-logo{position:absolute;top:13.4mm;left:0;right:0;text-align:center;font-family:'Montserrat',sans-serif;font-weight:600;font-size:1.9mm;letter-spacing:.22em;padding-left:.22em;color:#1d2a1a}
.eti .orn{position:absolute;top:15.8mm;left:0;right:0;text-align:center;color:#d4572e;font-size:2.4mm;line-height:1}
.eti .corpo{position:absolute;top:18.6mm;bottom:7.6mm;left:8.5mm;right:8.5mm;display:flex;flex-direction:column;align-items:center}
.eti .tit{flex:none;height:18mm;width:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.eti .it2{text-align:center;font-family:'Noto Serif Display',serif;font-stretch:70%;font-variation-settings:'wdth' 70;font-weight:600;line-height:1.02;color:#16241a;margin-top:.3mm}
.eti .basso{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.eti .it{text-align:center;font-family:'Noto Serif Display',serif;font-stretch:62.5%;font-variation-settings:'wdth' 62.5;font-weight:700;line-height:.98;color:#16241a}
.eti .en{margin-top:.6mm;text-align:center;font-family:'Noto Serif Display',serif;font-stretch:70%;font-variation-settings:'wdth' 70;font-weight:500;line-height:1.05;color:#16241a}
.eti .img{flex:none;height:38mm;width:100%;display:flex;align-items:center;justify-content:center;margin:1mm 0}
.eti .img img{width:38mm;height:38mm;object-fit:contain;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 58%,transparent 100%)}
.eti .img svg{height:100%;max-width:100%}
.eti .icone{display:flex;flex-wrap:wrap;flex-shrink:0;justify-content:center;align-items:center;gap:1.8mm 3mm}
.eti .ico{display:flex;align-items:center;gap:1.4mm}
.eti .ico .tondo{width:8.6mm;height:8.6mm;flex-shrink:0;border:.32mm solid #1d2a1a;border-radius:50%;display:flex;align-items:center;justify-content:center}
.eti .ico .tondo svg{width:5.6mm;height:5.6mm}
.eti .ico .tx{font-family:'Montserrat',sans-serif;font-weight:700;font-size:2.45mm;line-height:1.2;letter-spacing:.03em;color:#1d2a1a;text-align:left;white-space:nowrap}
.eti .ico .tx span{font-weight:600;opacity:.85}
.eti .sep{width:.25mm;height:7mm;background:#1d2a1a;opacity:.35}
.eti .claim{flex-shrink:0;margin-bottom:1.6mm;text-align:center;font-family:'Noto Serif Display',serif;font-style:italic;font-size:2.3mm;line-height:1.25;color:#3b4a32}
/* ── STAMPA: A4 orizzontale, 8 etichette (4 × 2) ── */
#fogli{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff} header,main{display:none!important} #fogli{display:block}
  .foglio{width:297mm;height:210mm;display:grid;grid-template-columns:repeat(4,72mm);grid-template-rows:repeat(2,105mm);justify-content:center;page-break-after:always;break-after:page}
  .foglio:last-child{page-break-after:auto;break-after:auto}
  .eti{outline:.1mm dashed #bbb}
}
#login{max-width:420px;margin:60px auto;background:#fff;border-radius:12px;padding:26px;text-align:center;border:1px solid #e3d8c2}
</style></head><body>
<header>
  <h1>GREED · Etichette banco</h1>
  <span class="stato" id="utente" style="color:#cfd8c4"></span>
  <span class="sp"></span>
  <label class="b-ghost" style="padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">🖼️ Logo GREED<input type="file" accept="image/png,image/svg+xml,image/jpeg" style="display:none" onchange="caricaLogo(this.files[0])"></label>
  <button class="b-ghost" onclick="selezionaCoda()">Seleziona da stampare</button>
  <button class="b-oro" onclick="stampa()">🖨️ Stampa selezionate (<span id="nsel">0</span>)</button>
</header>
<main>
  <div id="login" style="display:none"><h2 style="font-family:'Cormorant Garamond',serif;margin-top:0">Accesso</h2>
    <p class="stato">Le ricette arrivano dal gestionale: serve l'account GREED.</p>
    <button class="b-verde" onclick="accedi()">Accedi con Google</button><div id="loginErr" class="stato" style="color:#a33;margin-top:10px"></div></div>
  <div id="app" style="display:none">
    <div class="barra">
      <button class="tab on" id="t-coda" onclick="vista('coda')">🆕 Da stampare (<span id="ncoda">0</span>)</button>
      <button class="tab" id="t-tutti" onclick="vista('tutti')">Tutti i gusti (<span id="ntutti">0</span>)</button>
      <button class="b-verde" id="b-genera" onclick="generaFoto()" style="display:none">✨ Genera foto</button>
      <span class="stato" id="msg">I gusti nuovi del gestionale compaiono qui da soli. Quando sono 8 riempiono un foglio A4.</span>
    </div>
    <div class="griglia" id="griglia"></div>
  </div>
</main>
<div id="fogli"></div>
<script>
const ALLERGENI_REGOLE = [
  {k:'LATTE',     re:/\blatte\b(?!\s+di\s+(cocco|soia|mandorl|riso|avena))|panna(?!\s+(soia|vegetale|da cucina alpro))|\bburro\b(?!\s+di\s+(cacao|arachid))|yogurt(?!\s+soia)|ricotta|mascarpone|philadelphia|stracchino|pecorino|parmigiano|castelmagno|erborinato|gorgonzola|taleggio|scamorza|caprino|formagg|kefir|cr[eè]me fra[iî]che|proteine\s+(del\s+)?latte|\bmpc\b|\bwpc\b|siero\s+di\s+latte|lattosio|caseina|dulce de leche|baileys|cioccolato (al latte|bianco)|condensato|savoiard/i},
  {k:'UOVA',      re:/tuorl|\buov[oa]|albume|maionese|savoiard/i},
  {k:'GLUTINE',   re:/frumento|\bgrano\b|farina\s+(di\s+)?(grano|frumento|00|0\b|farro|orzo|segale)|\borzo\b|segale|\bavena\b(?!.*senza glutine)|farro|kamut|biscott|savoiard|\bpane\b|pangrattato|briciole|birra|\bmalto\b/i},
  {k:'FRUTTA A GUSCIO', re:/pistacch|mandorl|nocciol|\bnoc[ei]\b(?!\s+moscata)|anacard|\bpecan|macadamia|noci del brasile|gianduia|pralinat|torrone/i},
  {k:'ARACHIDI',  re:/arachid|peanut/i},
  {k:'SOIA',      re:/\bsoia\b|tofu|edamame/i},
  {k:'PESCE',     re:/\balic[ie]\b|acciug|colatura|tonno|baccal|salmone|merluzz|pesce|sgombr|sardin|worcestershire/i},
  {k:'CROSTACEI', re:/gamber|scamp|aragost|granchi|crostace/i},
  {k:'MOLLUSCHI', re:/cozz|vongol|polp[oi]|calamar|seppi|ostric/i},
  {k:'SEDANO',    re:/sedano/i},
  {k:'SENAPE',    re:/senape/i},
  {k:'SESAMO',    re:/sesamo|tahin/i},
  {k:'SOLFITI',   re:/\bvino\b|marsala|barolo|frascati|moscato|prosecco|vin santo|pedro xim|\baceto\b|spumante|passito/i},
  {k:'LUPINI',    re:/lupin/i},
];
function allergeniIngrediente(nome){
  const n=String(nome||'');
  return ALLERGENI_REGOLE.filter(a=>a.re.test(n)).map(a=>a.k);
}
// Basi e ingredienti composti (stessi dati del Libro ingredienti): "Base bianca" porta gli allergeni della sua ricetta,
// un ingrediente composto quelli dei suoi componenti (salvati in ingredienti_composti).
let BASI_LAB = {}, COMPOSTI_LAB = {};
const _normLab = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const _slugLab = s => _normLab(s).replace(/ /g, '-').slice(0, 120) || 'x';
const _eBaseLab = r => r && (r.tipo === 'base' || /^base\b|\bbase\s+(bianca|gialla|latte|frutta|neutra|vegan)/i.test(r.nome));
const _PRECOMP_ALG = [[/meringa/i, 'albume'], [/bombe|bomba/i, 'tuorlo'], [/pan di spagna/i, 'uova'], [/con[oi]\b.*(senza glutine|gf)|mini ?con|conett/i, 'soia']];
function testoAllergeniIng(nome, prof = 0) {
  const b = prof < 2 && BASI_LAB[_normLab(nome)];
  if (b) return nome + ' ' + (b.ingredienti || []).map(i => testoAllergeniIng(i.nome, prof + 1)).join(' ');
  const c = COMPOSTI_LAB[_slugLab(nome)];
  if (c) return nome + (!c.semplice && c.componenti ? ' ' + c.componenti : '');
  const p = _PRECOMP_ALG.find(([re]) => re.test(nome));
  return nome + (p ? ' ' + p[1] : '');
}
// Allergeni della ricetta = rilevati dagli ingredienti (basi e composti aperti) ∪ quelli scritti a mano nel campo "allergeni"
function allergeniRicetta(r){
  const set=new Set();
  (r&&r.ingredienti||[]).forEach(i=>allergeniIngrediente(testoAllergeniIng(i.nome)).forEach(a=>set.add(a)));
  const manuale=String((r&&r.allergeni)||'').toLowerCase();
  const MAN={'latte':'LATTE','uov':'UOVA','glutin':'GLUTINE','guscio':'FRUTTA A GUSCIO','arachid':'ARACHIDI','soia':'SOIA','pesce':'PESCE','crostace':'CROSTACEI','mollusc':'MOLLUSCHI','sedano':'SEDANO','senape':'SENAPE','sesamo':'SESAMO','solfit':'SOLFITI','lupin':'LUPINI'};
  Object.entries(MAN).forEach(([k,v])=>{ if(manuale.includes(k)) set.add(v); });
  const ordine=ALLERGENI_REGOLE.map(a=>a.k);
  return [...set].sort((a,b)=>ordine.indexOf(a)-ordine.indexOf(b));
}

  cacao: sv(`<path d="M60 18c20 10 28 34 24 56s-14 32-24 32-20-10-24-32 4-46 24-56z" fill="#7a4a2a"/><path d="M60 22v80M48 30c-6 20-6 52 2 70M72 30c6 20 6 52-2 70" fill="none" stroke="#5a3218" stroke-width="2.5"/><circle cx="92" cy="40" r="7" fill="#e8d6b0"/><circle cx="96" cy="56" r="6" fill="#e8d6b0"/>`),

  latte: sv(`<path d="M42 30h36l-4 12 10 16v40c0 4-3 6-6 6H42c-3 0-6-2-6-6V58l10-16z" fill="#fbf7ee"/><path d="M36 64h48v34c0 4-3 6-6 6H42c-3 0-6-2-6-6z" fill="#e7efe0"/><path d="M42 30h36" fill="none"/><path d="M54 80c4-6 8-6 12 0" fill="none" stroke="#8bb04a"/>`),

  caffe: sv(`<ellipse cx="46" cy="62" rx="18" ry="26" transform="rotate(-25 46 62)" fill="#6b3d1f"/><path d="M38 42c10 10 6 30 16 40" fill="none" stroke="#3e220f"/><ellipse cx="78" cy="66" rx="16" ry="23" transform="rotate(20 78 66)" fill="#7a4a2a"/><path d="M84 47c-8 10-4 28-12 38" fill="none" stroke="#3e220f"/>`),
  fragola: sv(`<path d="M60 104C34 88 26 60 34 46c8-12 44-12 52 0 8 14 0 42-26 58z" fill="#e0443e"/><path d="M40 44c6-8 12-8 20-2 8-6 14-6 20 2-8 6-32 6-40 0z" fill="#5f9a3a"/><path d="M60 40v-14" fill="none"/>${[[48,58],[60,62],[72,58],[52,74],[68,74],[60,88]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="1.6" ry="2.6" fill="#f7d26b" stroke="none"/>`).join('')}`),
  limone: sv(`<ellipse cx="60" cy="66" rx="38" ry="28" fill="#f4d23c"/><path d="M22 66c-6-2-6 2 0 0M98 66c6 2 6-2 0 0" fill="none"/><path d="M60 38c4-10 14-14 22-12-2 8-10 14-22 12z" fill="#6aa043"/>`),
  bergamotto: sv(`<circle cx="60" cy="66" r="34" fill="#c4d74a"/><circle cx="50" cy="56" r="3" fill="#a8bd36" stroke="none"/><circle cx="68" cy="74" r="3" fill="#a8bd36" stroke="none"/><path d="M60 32c4-10 14-14 22-12-2 8-10 14-22 12z" fill="#4f8a32"/>`),

  mirtillo: sv(`${[[46,62,16],[72,58,14],[60,82,16]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#4a5aa8"/><path d="M${x-4} ${y-r+4}l4 3 4-3" fill="none" stroke="#2f3a78" stroke-width="2"/>`).join('')}`),
  frutti_bosco: sv(`<circle cx="44" cy="70" r="16" fill="#4a5aa8"/><path d="M72 46c14 0 20 16 16 30-4 12-14 18-22 14-10-4-14-18-10-30 2-8 8-14 16-14z" fill="#c4325a"/>${[[66,58],[76,62],[70,72],[80,74],[74,84]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.2" fill="#e05a7a" stroke="none"/>`).join('')}<path d="M70 44c2-8 8-12 14-12" fill="none"/>`),

  [/yogurt/i,'yogurt'],[/pomodor/i,'pomodoro'],[/fior di latte|latte|panna|bianco/i,'latte']
];
// vince l'ingrediente scritto per primo nel nome (es. "Zucca, mandorla e cannella" → zucca)
function illustrazionePer(nome){
  let best = null;
  ILL_REGOLE.forEach(([re, k], ordine) => { const m = String(nome || '').match(re); if (m && (!best || m.index < best.i)) best = { i: m.index, k }; });
  return best ? best.k : 'gelato';
}

function nomeInglese(it) {
  let s = ' ' + String(it || '').toLowerCase().replace(/["“”]/g, '') + ' ';
  const tenuti = [];   // le frasi già tradotte non vanno ritradotte parola per parola
  EN_FRASI.forEach(([a, b]) => { s = s.split(' ' + a + ' ').join(' §' + (tenuti.push(b) - 1) + '§ '); });
  const out = s.trim().split(/\s+/).map(w => {
    const t = w.match(/^§(\d+)§$/); if (t) return tenuti[+t[1]];
    const pul = w.replace(/[^a-zàèéìòù'&()-]/gi, '');
    if (EN_PAROLE[pul] !== undefined) return EN_PAROLE[pul];
    return w;
  }).join(' ').replace(/\s+/g, ' ').trim();
  return out.charAt(0).toUpperCase() + out.slice(1);
}
// Nome italiano ben scritto: "PISTACCHIO" → "Pistacchio", "nocciola della tuscia" → "Nocciola della Tuscia"
function nomeItaliano(n) {
  const piccole = new Set(['di','del','della','delle','dei','e','con','al','alla','allo','ai','d','in','da']);
  const sigle = new Set(['dop','igp','bio','dpo']);
  return String(n || '').toLowerCase().split(/\s+/).map((w, i) => {
    if (sigle.has(w)) return w.toUpperCase();
    if (i > 0 && (piccole.has(w) || /^d'/.test(w))) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

      Q ${R - n} ${T + c + 8} ${R - n} ${T + c + 8 - n} L ${R - n} ${T + c} C ${R - 9} ${T + c - 1} ${R - 12} ${T + 6} ${36 + 13 - o * .3} ${T + 4}
      C ${36 + 6} ${T + o * .2} ${36 - 6} ${T + o * .2} ${36 - 13 + o * .3} ${T + 4} C ${L + 12} ${T + 6} ${L + 9} ${T + c - 1} ${L + n} ${T + c}
      L ${L + n} ${T + c + 8 - n} Q ${L + n} ${T + c + 8} ${L} ${T + c + 8} Z`;
  };
  return `<svg class="sagoma" viewBox="0 0 72 105" xmlns="http://www.w3.org/2000/svg">
    <path d="${P(0)}" fill="#fbf5e8" stroke="#1d2a1a" stroke-width=".55"/>
    <path d="${P(1.6)}" fill="none" stroke="#d4572e" stroke-width=".4"/></svg>`;
}

// Divide il nome: parte principale + resto più piccolo. Con "|" decidi tu dove dividere (es. "Burro | e visciole").
function dividiNome(it) {
  it = String(it || '').trim();
  if (it.includes('|')) { const [a, ...b] = it.split('|'); return [a.trim(), b.join(' ').trim()]; }
  if (it.length <= 16) return [it, ''];
  const m = it.match(/^(.+?)\s+((?:e|ed|con|al|allo|alla|ai|agli|alle|di|del|della|dei|delle|in|\+|&)\s.+)$/i);
  return m ? [m[1], m[2]] : [it, ''];
}
// Dopo il disegno: se il titolo non sta nel suo spazio fisso, rimpicciolisce le scritte (la foto resta sempre uguale)
function adattaTitoli(root) {
  (root || document).querySelectorAll('.eti .tit').forEach(t => {
    for (let i = 0; i < 25 && t.scrollHeight > t.clientHeight + 1; i++)
      t.querySelectorAll('.it,.it2,.en').forEach(x => { x.style.fontSize = (parseFloat(x.style.fontSize) * 0.94).toFixed(2) + 'mm'; });
  });
  (root || document).querySelectorAll('.eti .basso').forEach(t => {
    for (let i = 0; i < 12 && t.scrollHeight > t.clientHeight + 1; i++) t.style.zoom = ((parseFloat(t.style.zoom) || 1) * 0.94).toFixed(3);
  });
}
function etichettaHtml(d) {
  // nome su due livelli: "Burro e confettura di visciole" → "Burro" grande, "e confettura di visciole" più piccolo
  const [nomeP, nomeS] = dividiNome(d.it);
  const parole = nomeP.split(/\s+/), lunga = Math.max(...parole.map(p => p.length));
  let fs = Math.min(11, 55 / (0.37 * lunga));
  const stimaRighe = f => { let r = 1, l = 0; parole.forEach(p => { const w = p.length * 0.37 * f + (l ? 0.25 * f : 0); if (l + w > 55) { r++; l = p.length * 0.37 * f; } else l += w; }); return r; };
  while (stimaRighe(fs) > 2 && fs > 5.2) fs -= 0.3;
  const fsS = nomeS.length <= 22 ? 5 : nomeS.length <= 40 ? 4.3 : 3.7;
  const fsEn = d.en.length <= 24 ? 4.8 : d.en.length <= 40 ? 4.2 : 3.6;
  const foto = d.foto ? `<img src="${d.foto}" alt="">` : (ILL[d.img] || ILL.gelato);
  const icone = [];
  if (d.vegan) icone.push(`<div class="ico"><div class="tondo">${ICO.VEGAN}</div><div class="tx">VEGAN</div></div>`);
  d.al.forEach(a => icone.push(`<div class="ico"><div class="tondo">${ICO[a] || ICO.ALTRO}</div><div class="tx">${esc(a)}<br><span>${esc(EN_ALL[a] || '')}</span></div></div>`));
  // tutti gli allergeni sempre visibili: con più di due simboli vanno su due righe
  const iconeHtml = icone.join('');
  return `<div class="eti">${sagomaSvg()}
    <div class="logo">${typeof LOGO_GREED !== 'undefined' && LOGO_GREED ? `<img src="${LOGO_GREED}" alt="GREED">` : 'GREED'}</div>
    <div class="sotto-logo">GELATO NATURALE</div><div class="orn">❦</div>
    <div class="corpo">
      <div class="tit">
        <div class="it" style="font-size:${fs.toFixed(2)}mm">${esc(nomeP)}</div>
        ${nomeS ? `<div class="it2" style="font-size:${fsS.toFixed(2)}mm">${esc(nomeS)}</div>` : ''}
        <div class="en" style="font-size:${fsEn}mm">${esc(d.en)}</div>
      </div>
      <div class="img">${foto}</div>
      <div class="basso${d.claim && icone.length > 2 ? ' stretto' : ''}">
        ${d.claim ? `<div class="claim">${esc(d.claim)}</div>` : ''}
        <div class="icone">${iconeHtml}</div>
      </div>
    </div></div>`;
}

function riduci(file) {
  return new Promise((ok, ko) => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const x = c.getContext('2d'); x.fillStyle = '#fbf5e8'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.86));
    }; img.onerror = () => ko(new Error('Immagine non leggibile')); img.src = URL.createObjectURL(file);
  });
}
